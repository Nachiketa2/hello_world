<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <div class="eyebrow">ARCADE MODE // 001</div>
    <h1>Neon <span>Tic-Tac-Toe</span></h1>
    <p class="subtitle">Beat the machine. Own the grid.</p>

    <section class="scoreboard" aria-label="Scoreboard">
      <div><strong id="player-score">0</strong><small>YOU</small></div>
      <div class="status" id="status">Your move</div>
      <div><strong id="computer-score">0</strong><small>CPU</small></div>
    </section>

    <section class="board" id="board" aria-label="Tic-Tac-Toe board">
      <button class="cell" data-cell="0" aria-label="Square 1"></button>
      <button class="cell" data-cell="1" aria-label="Square 2"></button>
      <button class="cell" data-cell="2" aria-label="Square 3"></button>
      <button class="cell" data-cell="3" aria-label="Square 4"></button>
      <button class="cell" data-cell="4" aria-label="Square 5"></button>
      <button class="cell" data-cell="5" aria-label="Square 6"></button>
      <button class="cell" data-cell="6" aria-label="Square 7"></button>
      <button class="cell" data-cell="7" aria-label="Square 8"></button>
      <button class="cell" data-cell="8" aria-label="Square 9"></button>
    </section>

    <button class="reset" id="reset">New round</button>
    <p class="hint">You are <b class="x-label">X</b>. The CPU is <b class="o-label">O</b>.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
